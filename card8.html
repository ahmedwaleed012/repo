<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌸 كلمة من القلب 🌸</title>
    <style>
        :root {
            --primary-pink: #ff8da1;
            --dark-pink: #ff6b8b;
            --light-pink: #fff0f3;
            --text-main: #5c3d47;
            --text-muted: #8c6d76;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--light-pink);
            background-image: radial-gradient(#ffccd5 20%, transparent 20%),
                              radial-gradient(#ffccd5 20%, transparent 20%);
            background-size: 30px 30px;
            background-position: 0 0, 15px 15px;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem 1rem;
        }

        .main-card {
            max-width: 600px;
            width: 100%;
            background: white;
            border: 4px solid #ffccd5;
            border-radius: 30px;
            padding: 2.5rem 2rem;
            box-shadow: 0 15px 35px rgba(255, 141, 161, 0.2);
            text-align: center;
        }

        .beating-heart {
            font-size: 3.5rem;
            margin-bottom: 0.5rem;
            display: inline-block;
            animation: beat 1.2s infinite;
        }

        h2 {
            color: var(--dark-pink);
            font-size: 1.8rem;
            margin-bottom: 1.5rem;
        }

        /* 📸 كولاج الصور الثلاثة بتصميم متداخل وأنيق */
        .heart-gallery {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .heart-photo {
            background: white;
            padding: 6px 6px 16px 6px;
            border: 1px solid #ffe3e8;
            border-radius: 12px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.05);
            width: 150px;
            transition: transform 0.3s ease;
        }

        .heart-photo img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 8px;
        }

        /* زوايا ميلان عفوية لكل صورة */
        .p1 { transform: rotate(-5deg); }
        .p2 { transform: rotate(3deg); translateY(-5px); }
        .p3 { transform: rotate(-2deg); }

        .heart-photo:hover {
            transform: scale(1.1) rotate(0deg);
            z-index: 5;
            box-shadow: 0 10px 20px rgba(255, 107, 139, 0.2);
        }

        /* صندوق نص الرسالة */
        .message-content {
            background: #fffafb;
            border: 2px dashed #ffccd5;
            border-radius: 20px;
            padding: 1.5rem;
            line-height: 1.8;
            font-size: 1.05rem;
            color: var(--text-main);
            text-align: justify;
            white-space: pre-line;
        }

        /* زر العودة للرئيسية */
        .btn-back {
            display: inline-block;
            margin-top: 2rem;
            padding: 10px 24px;
            background: var(--primary-pink);
            color: white;
            border: none;
            border-radius: 15px;
            font-size: 1rem;
            font-weight: bold;
            text-decoration: none;
            box-shadow: 0 4px 0px var(--dark-pink);
            transition: all 0.2s ease;
        }

        .btn-back:hover { background: var(--dark-pink); }
        .btn-back:active { transform: translateY(2px); box-shadow: 0 2px 0px var(--dark-pink); }

        @keyframes beat {
            0%, 100% { transform: scale(1); }
            25% { transform: scale(1.15); }
            70% { transform: scale(1.05); }
        }
    </style>
</head>
<body>

    <div class="main-card">
        <div class="beating-heart">💝</div>
        <h2>رسالة من أعماق قلبي</h2>

        <!-- 📸 معرض الصور الثلاثية المتداخلة -->
        <div class="heart-gallery">
            
            <!-- الصورة الأولى -->
            <div class="heart-photo p1">
                <!-- ⚠️ ضع رابط الصورة الأولى هنا -->
                <img src="./1.jpeg" alt="لقطة من القلب 1">
            </div>

            <!-- الصورة الثانية -->
            <div class="heart-photo p2">
                <!-- ⚠️ ضع رابط الصورة الثانية هنا -->
                <img src="./2.jpeg" alt="لقطة من القلب 2">
            </div>

            <!-- الصورة الثالثة -->
            <div class="heart-photo p3">
                <!-- ⚠️ ضع رابط الصورة الثالثة هنا -->
                <img src="./WhatsApp Image 2026-06-15 at 3.29.49 PM.jpeg" alt="لقطة من القلب 3">
            </div>

        </div>
        
        <!-- نص الرسالة المؤثرة -->

        <!-- زر العودة للوحة التحكم -->
        <a href="./dashboard.html" class="btn-back">✨ العودة للرئيسية</a>
    </div>

</body>
</html>

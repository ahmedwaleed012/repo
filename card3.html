<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌸 أغنية بتفكرني بيكي 🌸</title>
    <style>
        :root {
            --primary-pink: #ff8da1;
            --dark-pink: #ff6b8b;
            --light-pink: #fff0f3;
            --text-main: #5c3d47;
            --text-muted: #8c6d76;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }

        body {
            background-color: var(--light-pink);
            background-image: radial-gradient(#ffccd5 20%, transparent 20%), radial-gradient(#ffccd5 20%, transparent 20%);
            background-size: 30px 30px; background-position: 0 0, 15px 15px;
            color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 2rem 1rem;
        }

        .song-container {
            max-width: 450px; width: 100%; background: white; border: 4px solid #ffccd5; border-radius: 30px; padding: 2.5rem 1.5rem; box-shadow: 0 15px 35px rgba(255, 141, 161, 0.2); text-align: center;
        }

        .vinyl-record {
            width: 180px; height: 180px; background: #1a1a1a; border-radius: 50%; margin: 0 auto 2rem auto; border: 6px solid #fff; box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15), 0 0 0 3px var(--primary-pink); position: relative; display: flex; justify-content: center; align-items: center; animation: spin 8s linear infinite; animation-play-state: paused; overflow: hidden;
        }

        .audio-cover { width: 100px; height: 100px; border-radius: 50%; border: 4px solid #1a1a1a; object-fit: cover; z-index: 2; background-color: var(--primary-pink); }
        .vinyl-center-hole { position: absolute; width: 16px; height: 16px; background: var(--light-pink); border-radius: 50%; z-index: 3; box-shadow: inset 0 2px 4px rgba(0,0,0,0.3); border: 2px solid #fff; }

        h2 { font-size: 1.6rem; color: var(--dark-pink); margin-bottom: 0.5rem; }
        .subtitle { font-size: 0.95rem; color: var(--text-muted); margin-bottom: 2rem; }

        .audio-player-wrapper { background: #fff5f6; padding: 1rem; border-radius: 20px; border: 2px dashed #ffccd5; margin-bottom: 2rem; }
        audio { width: 100%; outline: none; }
        audio::-webkit-media-controls-panel { background-color: #fff5f6; }

        .lyrics-box { background: #fffbfb; border-radius: 16px; padding: 1.2rem; font-size: 1rem; line-height: 1.8; color: var(--text-main); border: 1px solid #ffe3e8; margin-bottom: 1.5rem; font-style: italic; }

        .btn-back { display: inline-block; padding: 10px 24px; background: var(--primary-pink); color: white; border-radius: 15px; font-weight: bold; text-decoration: none; box-shadow: 0 4px 0px var(--dark-pink); transition: all 0.2s ease; }
        .btn-back:hover { background: var(--dark-pink); }
        .btn-back:active { transform: translateY(2px); box-shadow: 0 2px 0px var(--dark-pink); }

        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="song-container">
        <div class="vinyl-record" id="vinyl">
            <!-- ⚠️ ضع رابط بوستر الأغنية هنا -->
            <img src="https://images.unsplash.com/photo-1498038432885-c6f3f1b912ee?q=80&w=300" alt="غلاف الأغنية" class="audio-cover">
            <div class="vinyl-center-hole"></div>
        </div>

        <h2>أغنية بتفكرني بيكي 🎧</h2>
        <p class="subtitle">الموسيقى دي تحديدًا اتخلقت عشان توصفك لقلبي..</p>

        <div class="audio-player-wrapper">
            <!-- ⚠️ ضع ملف الـ MP3 الخاص بك هنا -->
            <audio id="my-audio" controls>
                <source src="./aaa.m4a" type="audio/mpeg">
            </audio>
        </div>

        <div class="lyrics-box">
            يا حلوة بالليل
            الكحل على عينيكي

<br>
            Ouf, mademoiselle
<br>
            واقفة على جنب
وقلبي المسكين تعبان مالوش ذنب 💖
        </div>

        <a href="../dashboard.html" class="btn-back">✨ العودة للرئيسية</a>
    </div>

    <script>
        const audio = document.getElementById('my-audio');
        const vinyl = document.getElementById('vinyl');
        audio.addEventListener('play', () => vinyl.style.animationPlayState = 'running');
        audio.addEventListener('pause', () => vinyl.style.animationPlayState = 'paused');
        audio.addEventListener('ended', () => vinyl.style.animationPlayState = 'paused');
    </script>
</body>
</html>
